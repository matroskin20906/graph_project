build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 12
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  NestedBlockDepth:
    active: true
    threshold: 4
  ComplexCondition:
    active: true
    threshold: 4

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - "-1"
      - "0"
      - "1"
      - "2"
    ignoreEnums: true

  ReturnCount:
    active: true
    max: 3

  ThrowsCount:
    active: true
    max: 2

  ForbiddenComment:
    active: true
    comments:
      - "TODO:"
      - "FIXME:"

  UnusedPrivateMember:
    active: true

  WildcardImport:
    active: true

  MaxLineLength:
    active: true
    maxLineLength: 120

naming:
  FunctionNaming:
    active: true
  VariableNaming:
    active: true
  ClassNaming:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Exception
      - Throwable

  SwallowedException:
    active: true

performance:
  SpreadOperator:
    active: true

potential-bugs:
  UnsafeCast:
    active: true

  UnreachableCode:
    active: true